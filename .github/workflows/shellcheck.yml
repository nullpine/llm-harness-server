name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update && sudo apt-get install -y shellcheck
          }
          shellcheck --version

      # Provisioning scripts get re-run on half-configured VMs; a warning here is
      # a footgun there. Warnings fail the build.
      - name: Lint scripts
        run: shellcheck --severity=warning --shell=bash scripts/*.sh scripts/profiles/*.sh
