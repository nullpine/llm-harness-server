[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-control"
version = "0.1.0"
description = "Control plane for the LLM Harness: owns exactly one vLLM process at a time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  # Ceiling comes from vLLM: it pins fastapi<0.137 and shares /opt/harness/.venv
  # with the control plane, so the two must co-resolve. Raise it when vLLM does.
  "fastapi>=0.136.0,<0.137",
  "uvicorn[standard]>=0.52.4,<0.53",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15.0,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
# Everything CI needs. Deliberately free of vLLM: the suite runs with no GPU.
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-timeout>=2.4.0,<3",
  "ruff>=0.16.4,<0.17",
  "types-PyYAML>=6.0.12,<7",
]
# Installed on the VM only. The exact vLLM version is pinned here and resolved
# into requirements.lock; CLI flags move between releases (see CLAUDE.md).
vllm = ["vllm==0.27.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_control"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Ruff also formats Python inside Markdown fences. docs/API-CONTRACT.md must stay
# byte-identical to the copy in the desktop repo (CLAUDE.md rule 3), and the fences
# in docs/ are illustrative sketches, not code. Keep the tool out of Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "A",     # builtin shadowing
  "ARG",   # unused arguments
  "ASYNC", # blocking calls in async paths — see .claude/rules/process-safety.md
  "B",     # bugbear
  "C4",    # comprehensions
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # import sorting
  "N",     # naming
  "PTH",   # pathlib over os.path
  "RUF",
  "S",     # bandit — this process handles an API key and spawns subprocesses
  "SIM",
  "T20",   # no stray print()
  "TID",   # no relative imports across packages
  "UP",
  "W",
]
# The formatter owns line length for code; E501 would only ever fire on prose.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]        # asserts and unused fixture arguments are the point

[tool.ruff.lint.isort]
known-first-party = ["harness_control"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# tests/ is on sys.path so `from fake_upstream import ...` works without a package.
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
timeout = 60
